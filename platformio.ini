; HALDANE - ATmega32 bare-metal build (no framework).
;   pio run              build
;   pio run -t upload    flash over USBasp
;   pio run -t fuses     write lfuse 0x3F / hfuse 0xC9 (16 MHz crystal, BOD 4.0 V, JTAG off)
[platformio]
src_dir = firmware
default_envs = atmega32

[env:atmega32]
platform = atmelavr
board = ATmega32
board_build.f_cpu = 16000000L
build_src_filter = +<avr/*.c> +<core/*.c>
build_flags =
    -std=gnu99
    -Os
    -Wall
    -Wextra
    -Ifirmware/core
    -DHD_ROM=__flash
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
upload_protocol = usbasp
upload_flags = -e
board_fuses.lfuse = 0x3F
board_fuses.hfuse = 0xC9
