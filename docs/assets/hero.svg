<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t d">
  <title id="t">HALDANE</title>
  <desc id="d">A bare-metal ATmega32 safety node. Raw carbon monoxide readings spike up and down while the estimated blood carboxyhaemoglobin of the occupant rises smoothly toward the 10 percent line; the alarm fires at 5.5 percent.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#D3D7DB" stroke-width="1"/>
    </pattern>
    <pattern id="grid5" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M120 0H0V120" fill="none" stroke="#B8BEC4" stroke-width="1"/>
    </pattern>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9B000" stop-opacity=".35"/>
      <stop offset="1" stop-color="#E9B000" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#D62828" stop-opacity=".45"/>
      <stop offset="1" stop-color="#D62828" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- bench -->
  <rect x="1" y="1" width="1198" height="418" rx="14" fill="#F7F8F9" stroke="#D3D7DB" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="418" rx="14" fill="url(#grid)" opacity=".55"/>
  <rect x="1" y="1" width="1198" height="418" rx="14" fill="url(#grid5)" opacity=".6"/>
  <g fill="none" stroke="#B8BEC4" stroke-width="2">
    <path d="M18 42V18H42"/><path d="M1158 18H1182V42"/><path d="M1182 378V402H1158"/><path d="M42 402H18V378"/>
  </g>

  <!-- wordmark: a canary sitting on a chip -->
  <g transform="translate(64 104)">
    <rect x="2" y="26" width="40" height="18" rx="3" fill="#14171A"/>
    <g stroke="#14171A" stroke-width="2.4" stroke-linecap="round">
      <path d="M9 44v6M17 44v6M25 44v6M33 44v6"/>
    </g>
    <circle cx="9" cy="35" r="2" fill="#0C8F9B"/>
    <path d="M10 26c0-12 8-20 18-20 6 0 10 4 10 9 0 3-1 5-3 6l6 3-7 1c-3 1-6 1-9 1z" fill="#E9B000" stroke="#14171A" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="30" cy="12" r="2" fill="#14171A"/>
    <path d="M37 13l6-2-5 5z" fill="#14171A"/>
  </g>
  <g font-family="'Chakra Petch','Segoe UI','Helvetica Neue',Arial,sans-serif">
    <text x="122" y="146" font-size="50" font-weight="700" fill="#14171A" textLength="270" lengthAdjust="spacingAndGlyphs">HALDANE<tspan fill="#E9B000">.</tspan></text>
  </g>
  <g font-family="'JetBrains Mono','Cascadia Mono',Consolas,'Courier New',monospace" fill="#4A5157">
    <text x="66" y="194" font-size="12.5" textLength="374" lengthAdjust="spacingAndGlyphs">ATMEGA32 · FIXED-POINT CFK · UL 2034 WINDOWS</text>
    <text x="66" y="230" font-size="15.5" fill="#14171A" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" textLength="374" lengthAdjust="spacingAndGlyphs">Alarms on what the air does to your blood, not on ppm.</text>
  </g>

  <!-- chips -->
  <g font-family="'JetBrains Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="13" font-weight="700">
    <g transform="translate(66 262)">
      <rect width="96" height="34" rx="6" fill="#E9B000"/><circle cx="16" cy="17" r="4" fill="#14171A"/>
      <text x="28" y="22" fill="#14171A" textLength="56" lengthAdjust="spacingAndGlyphs">COHb</text>
    </g>
    <g transform="translate(172 262)">
      <rect width="96" height="34" rx="6" fill="#FDFDFE" stroke="#0C8F9B" stroke-width="1.6"/><circle cx="16" cy="17" r="4" fill="#0C8F9B"/>
      <text x="28" y="22" fill="#0C8F9B" textLength="56" lengthAdjust="spacingAndGlyphs">8-BIT</text>
    </g>
    <g transform="translate(278 262)">
      <rect width="118" height="34" rx="6" fill="#FDFDFE" stroke="#D62828" stroke-width="1.6"/><circle cx="16" cy="17" r="4" fill="#D62828"/>
      <text x="28" y="22" fill="#D62828" textLength="78" lengthAdjust="spacingAndGlyphs">CO · FIRE</text>
    </g>
  </g>

  <!-- scope trace: MQ-7 heater cycle (5 V / 1.4 V) -->
  <g transform="translate(66 318)">
    <rect width="330" height="62" rx="5" fill="#FDFDFE" stroke="#D3D7DB"/>
    <path d="M0 31H330M82 0V62M165 0V62M247 0V62" stroke="#ECEEF0"/>
    <path d="M0 14H52V46H130V14H182V46H260V14H312V46H330" fill="none" stroke="#0C8F9B" stroke-width="2" stroke-dasharray="560" stroke-dashoffset="560">
      <animate attributeName="stroke-dashoffset" values="560;0;0" keyTimes="0;.7;1" dur="4s" repeatCount="indefinite"/>
    </path>
    <g fill="#E9B000">
      <circle cx="126" cy="46" r="3.5"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.3;.32;1" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="256" cy="46" r="3.5"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.6;.62;1" dur="4s" repeatCount="indefinite"/></circle>
    </g>
    <text x="8" y="58" font-family="'JetBrains Mono','Cascadia Mono',Consolas,monospace" font-size="9" fill="#828A90" textLength="196" lengthAdjust="spacingAndGlyphs">MQ-7 HEATER 60 s · 5 V / 90 s · 1.4 V</text>
  </g>

  <!-- right panel: raw ppm vs estimated COHb -->
  <g transform="translate(470 52)" font-family="'JetBrains Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11">
    <rect width="700" height="316" rx="10" fill="#FDFDFE" stroke="#D3D7DB"/>
    <text x="18" y="28" fill="#828A90" textLength="420" lengthAdjust="spacingAndGlyphs">RAW CO (ppm) SPIKES · ESTIMATED COHb OF THE OCCUPANT RISES</text>
    <!-- axes -->
    <path d="M56 52V272H676" fill="none" stroke="#B8BEC4" stroke-width="1.4"/>
    <path d="M56 162H676M56 217H676M56 107H676" stroke="#ECEEF0"/>
    <!-- 10 % danger line -->
    <path d="M56 74H676" stroke="#D62828" stroke-width="2.2"/>
    <text x="606" y="68" fill="#D62828" font-weight="700" textLength="64" lengthAdjust="spacingAndGlyphs">10 % COHb</text>
    <!-- 5.5 % alarm line -->
    <path d="M56 151H676" stroke="#14171A" stroke-width="1.4" stroke-dasharray="6 5"/>
    <text x="606" y="145" fill="#14171A" textLength="64" lengthAdjust="spacingAndGlyphs">ALARM 5.5</text>

    <!-- raw ppm: spiky bars (cooking spikes, then a real leak) -->
    <g fill="#0C8F9B" fill-opacity=".55">
      <rect x="84" y="206" width="9" height="66" rx="2"><animate attributeName="fill-opacity" values=".25;.7;.25" dur="1.6s" repeatCount="indefinite"/></rect>
      <rect x="98" y="232" width="9" height="40" rx="2"/>
      <rect x="166" y="190" width="9" height="82" rx="2"><animate attributeName="fill-opacity" values=".25;.7;.25" dur="1.6s" begin=".4s" repeatCount="indefinite"/></rect>
      <rect x="180" y="246" width="9" height="26" rx="2"/>
      <rect x="250" y="214" width="9" height="58" rx="2"><animate attributeName="fill-opacity" values=".25;.7;.25" dur="1.6s" begin=".8s" repeatCount="indefinite"/></rect>
      <rect x="330" y="236" width="9" height="36" rx="2"/>
      <rect x="350" y="214" width="9" height="58" rx="2"/>
      <rect x="370" y="204" width="9" height="68" rx="2"/>
      <rect x="390" y="198" width="9" height="74" rx="2"/>
      <rect x="410" y="194" width="9" height="78" rx="2"/>
      <rect x="430" y="196" width="9" height="76" rx="2"/>
      <rect x="450" y="192" width="9" height="80" rx="2"/>
      <rect x="470" y="195" width="9" height="77" rx="2"/>
      <rect x="490" y="193" width="9" height="79" rx="2"/>
      <rect x="510" y="194" width="9" height="78" rx="2"/>
      <rect x="530" y="192" width="9" height="80" rx="2"/>
      <rect x="550" y="195" width="9" height="77" rx="2"/>
      <rect x="570" y="193" width="9" height="79" rx="2"/>
      <rect x="590" y="194" width="9" height="78" rx="2"/>
    </g>
    <!-- the fixed-ppm alarm would trip on every spike -->
    <path d="M56 214H676" stroke="#0C8F9B" stroke-width="1" stroke-dasharray="2 4"/>
    <text x="64" y="208" fill="#0C8F9B" textLength="132" lengthAdjust="spacingAndGlyphs">50 ppm fixed threshold</text>

    <!-- COHb curve (canary) -->
    <path d="M56 266C90 262 110 258 130 260S170 252 190 255S240 250 270 252S320 246 340 238S400 196 440 172S510 140 560 118S640 98 676 92V272H56Z" fill="url(#fill)" opacity=".9"/>
    <path d="M56 266C90 262 110 258 130 260S170 252 190 255S240 250 270 252S320 246 340 238S400 196 440 172S510 140 560 118S640 98 676 92" fill="none" stroke="#E9B000" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="760" stroke-dashoffset="760">
      <animate attributeName="stroke-dashoffset" values="760;0;0" keyTimes="0;.75;1" dur="6s" repeatCount="indefinite"/>
    </path>
    <!-- alarm marker where the curve crosses 5.5 % -->
    <g transform="translate(486 151)">
      <circle r="22" fill="url(#glow)" opacity="0">
        <animate attributeName="opacity" values="0;0;1;0;1;0" keyTimes="0;.55;.62;.72;.82;1" dur="6s" repeatCount="indefinite"/>
      </circle>
      <circle r="6" fill="#D62828" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.55;.57;1" dur="6s" repeatCount="indefinite"/>
      </circle>
    </g>
    <text x="58" y="296" fill="#4A5157" textLength="610" lengthAdjust="spacingAndGlyphs">COOKING SPIKES: NO ALARM · SUSTAINED LEAK: ALARM INSIDE THE UL 2034 WINDOW · 10 % NEVER REACHED</text>
  </g>
</svg>
